{% extends "base.html" %}
{% block title %}Page Not Found — {{ site_name }}{% endblock %}
{% block content %}
<div class="page-wrap" style="text-align:center; padding-top:80px; padding-bottom:100px;">
  <div class="eyebrow">Error 404</div>
  <h1 style="margin:14px 0;">This page could not be found</h1>
  <p style="max-width:420px; margin:0 auto 26px;">The page you're looking for may have been moved or no longer exists.</p>
  <a href="{{ url_for('home') }}" class="btn btn-gold">Return Home</a>
</div>
{% endblock %}
