{% extends "base.html" %}
{% block title %}Log In — {{ site_name }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-panel">
    <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="CCC Crest" class="crest-mini">
    <h2>Welcome Back</h2>
    <p class="sub">Log in to continue your preparation.</p>

    <form method="POST" action="{{ url_for('login_page') }}">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Your password" required>
      </div>
      <button type="submit" class="btn btn-gold btn-block">Log In</button>
    </form>

    <div class="auth-switch">New here? <a href="{{ url_for('signup_page') }}">Create an Account</a></div>
  </div>
</div>
{% endblock %}
